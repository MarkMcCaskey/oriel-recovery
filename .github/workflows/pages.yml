name: Publish browser player
# Enable Pages > Source > GitHub Actions, then run this workflow manually.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown
      - run: rustup override set 1.93.0
      - run: cargo test --offline
      - run: ./scripts/build-web.sh
      - run: node scripts/test-web.mjs
      - run: python3 scripts/audit.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
